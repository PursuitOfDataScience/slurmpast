name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  id-token: write # Trusted Publishing; no API token is stored anywhere
  contents: read

jobs:
  build-and-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # The version lives in src/slurmpast/_version.py (read by
      # [tool.setuptools.dynamic]), not in pyproject.toml, so it is read from
      # there rather than parsed out of the manifest as slurmate does.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/slurmpast/_version.py').read_text()).group(1))")
          echo "tag=$TAG  package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match __version__ $PKG"
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Check artifacts with twine
        run: twine check dist/*

      # An installed wheel is what users get; a package that imports from the
      # source tree but not from site-packages is a packaging bug this catches.
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/slurmpast --version
          /tmp/check/bin/slurmpast --demo --overview --plain --no-color > /dev/null
          /tmp/check/bin/python -c "import slurmpast, pathlib; \
            assert (pathlib.Path(slurmpast.__file__).parent / 'py.typed').is_file(), 'py.typed missing from the wheel'"

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
