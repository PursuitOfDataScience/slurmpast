name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  id-token: write # Trusted Publishing; no API token is stored anywhere
  contents: read

jobs:
  # The gate, and it runs HERE rather than being assumed from ci.yml. GitHub
  # cannot express `needs:` across workflow files, so a tag push went straight to
  # publish with no dependency on the suite at all -- and a PyPI upload cannot be
  # taken back: the version is burned whether or not the code works. This runs on
  # the tagged commit, which is the commit being shipped. Same job, same reason,
  # as nodetop's and rapidu's; those two had it and this one did not.
  gate:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/ tests/
      - run: python -m pytest -q

  build-and-publish:
    needs: gate
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # The version lives in src/slurmpast/_version.py (read by
      # [tool.setuptools.dynamic]), not in pyproject.toml, so it is read from
      # there rather than parsed out of the manifest as slurmate does.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/slurmpast/_version.py').read_text()).group(1))")
          echo "tag=$TAG  package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match __version__ $PKG"
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Check artifacts with twine
        run: twine check dist/*

      # An installed wheel is what users get; a package that imports from the
      # source tree but not from site-packages is a packaging bug this catches.
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/slurmpast --version
          /tmp/check/bin/slurmpast --demo --overview --plain --no-color > /dev/null
          /tmp/check/bin/python -c "import slurmpast, pathlib; \
            assert (pathlib.Path(slurmpast.__file__).parent / 'py.typed').is_file(), 'py.typed missing from the wheel'"

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
