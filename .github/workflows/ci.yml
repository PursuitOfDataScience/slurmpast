name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=77" wheel

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src/ tests/

      # No Slurm on a GitHub runner, and that is deliberate: every test drives
      # the parser and the dashboard through fixtures or the built-in synthetic
      # history, so nothing here shells out to sacct. Verified locally by running
      # the suite with slurm stripped from PATH.
      - name: Test with pytest
        run: python -m pytest --cov=slurmpast --cov-report=xml --cov-report=term --cov-fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # The dependency floor is `textual>=0.86,<9`, and CI otherwise resolves the
  # newest (8.2.8 at time of writing). Without this job that floor is a claim
  # nobody checks -- and the two are genuinely different: 0.8x has no in-app
  # text-selection API and still exposes `Static.renderable`, 8.x reverses both.
  oldest-textual:
    name: Oldest supported Textual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: |
          pip install -e ".[dev]"
          pip install "textual==0.86.*"
      - run: python -c "import textual; print('textual', textual.__version__)"
      - run: python -m pytest -q

  no-slurm:
    name: Runs with no Slurm installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # A post-mortem tool must fail cleanly, not traceback, when the scheduler
      # is absent -- someone will inevitably try it on their laptop.
      - name: Missing sacct is a clean error, not a crash
        run: |
          set +e
          out=$(slurmpast --overview --plain --no-color 2>&1)
          code=$?
          echo "$out"
          set -e
          test $code -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
          case "$out" in
            *Traceback*) echo "crashed instead of reporting"; exit 1 ;;
          esac

      - name: The demo history needs no scheduler at all
        run: |
          slurmpast --demo --overview --plain --no-color
          slurmpast --demo --patterns --no-color
          slurmpast --demo --nodes --no-color
          slurmpast --demo --sizing --no-color
          slurmpast --demo --overview --json

      # `site` reads `scontrol show config` to word what a measurement means on
      # this cluster. With no scontrol it must return "cannot say" and every
      # caller must cope -- not raise, and not assert the Midway3 answer.
      - name: A missing scontrol degrades to "cannot say"
        run: |
          python - <<'PY'
          from slurmpast.site import gpu_utilization_note, maxrss_caveat, site
          found = site(refresh=True)
          assert not found.known, found
          assert found.rss_from_cgroup is None
          assert "depending on this cluster" in maxrss_caveat()
          assert gpu_utilization_note() == "not recorded by Slurm"
          print("unknown site handled:", maxrss_caveat())
          PY

      # The demo is meant to look the same everywhere. It pins its own synthetic
      # site config for exactly that reason, so this output must match what a
      # login node prints.
      #
      # This used to grep for "jobacct_gather/linux", which the caveats named in
      # full until 0.9.0 shortened them. The plugin name was only ever a proxy
      # for "the demo used its pinned site and not the runner's". Both halves of
      # that are asserted directly now, which is what the proxy stood for and is
      # stronger than it was: the linux wording present, AND the wording an
      # unknown site produces absent -- a bare runner has no scontrol, so
      # forgetting to pin would show up as the second one.
      - name: The demo does not vary with the host cluster
        run: |
          out=$(slurmpast --demo --sizing --no-color)
          echo "$out" | grep -q "double-counts shared pages here" \
            || { echo "the demo did not use its pinned jobacct_gather/linux site"; exit 1; }
          echo "$out" | grep -q "depending on this cluster" \
            && { echo "the demo fell back to the runner's unknown site"; exit 1; }
          true
